<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Foyer</title>
<link rel="stylesheet" href="home.css">
</head>
<body>
<script>
  // The look the home screen last had, before anything is drawn, so a night start doesn't flash the day one first.
  try {
    if (localStorage.getItem('foyer.night') === 'true') {
      document.documentElement.style.background = '#0B0B0D';
      document.body.className = 'night';
    }
  } catch (e) {}
</script>
<div id="stage">
  <div id="sky" class="layer">
    <div class="grad day"></div>
    <div class="grad night"></div>
    <canvas id="bgA" width="48" height="27"></canvas>
    <canvas id="bgB" width="48" height="27"></canvas>
    <div class="veil"></div>
    <div class="lift"></div>
    <div id="wall"><div class="pic"></div><div class="pic"></div><div id="scene"><div class="bg"></div><div class="shadebg"></div><div class="stars a"></div><div class="stars b"></div><div class="moon"></div><div class="rays"></div><div class="hare"></div><div class="fx snowfar"></div><div class="clock"><div class="fill"></div><div class="rim"></div></div><div class="fg"></div><div class="shadefg"></div><div class="deco tinsel"></div><div class="deco baubles"></div><div class="deco lights1"></div><div class="deco lights2"></div><div class="xstar"></div><div class="mist m1"></div><div class="mist m2"></div><div class="clouds"></div><canvas width="1920" height="1080"></canvas><div class="fx rain2"></div><div class="fx rain1"></div><div class="flash"></div><div class="fx snownear"></div><div class="fx petals"></div><div class="bat b1"><div></div></div><div class="bat b2"><div></div></div><div class="bat b3"><div></div></div><div class="eggs"></div><div class="date"></div></div><div class="shade top"></div><div class="shade left"></div><div class="shade low"></div><div class="shade dim"></div></div>
  </div>
  <div id="home" class="layer">
    <div id="top" class="layer">
      <h1 id="title"></h1>
      <div id="tabs"></div>
      <div id="quotes"></div>
      <div id="buttons"></div>
      <div id="cards"></div>
      <div id="clock"><span class="time"></span><span class="date"></span></div>
    </div>
    <div id="ambient"><div class="time"></div><div class="date"></div><div class="wx"></div><div class="what"></div><div class="hero"><div class="t"></div><div class="m"></div><div class="o"></div><div class="dots"></div></div></div>
    <div id="resume"></div>
    <div id="platter"></div>
    <div id="tiles"></div>
  </div>
  <div id="drawer" class="layer"></div>
  <div id="discover"><img class="pic" alt=""><img class="pic" alt=""><div class="shade"></div><div class="info"><div class="t"></div><div class="m"></div><div class="o"></div><div class="w"></div></div><div class="rows"><div class="all"></div></div></div>
  <div id="apps" class="layer sheet"><h2></h2><div class="grid"></div></div>
  <div id="settings" class="layer sheet"><div class="box"></div></div>
  <div id="shelfedit" class="layer sheet"><div class="box"></div></div>
  <div id="langpick" class="layer sheet"><div class="box"></div></div>
  <div id="citypick" class="layer sheet"><div class="box"></div></div>
  <div id="keypick" class="layer sheet"><div class="box"></div></div>
  <div id="seerrpick" class="layer sheet"><div class="box"></div></div>
  <div id="about" class="layer sheet"><div class="box"></div></div>
  <div id="info"></div>
  <div id="phone"></div>
  <div id="appmenu" class="glass"></div>
  <div id="saver" class="layer"></div>
  <div id="toast"></div>
</div>
<script src="config.js"></script>
<script src="coins.js"></script>
<script src="i18n.js"></script>
<script src="strings.js"></script>
<script src="tv.js"></script>
<script src="zones.js"></script>
<script src="data.js"></script>
<script src="home.js"></script>
</body>
</html>
